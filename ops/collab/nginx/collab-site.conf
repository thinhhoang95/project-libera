# Libera collab server: TLS termination and proxy to the container on
# 127.0.0.1:4400, including the WebSocket sync endpoint at /sync.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name collab.libera.intuelle.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name collab.libera.intuelle.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/collab.libera.intuelle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/collab.libera.intuelle.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Blob uploads (images, PDFs) up to the server's MAX_BLOB_BYTES.
    client_max_body_size 100m;

    location = /sync {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Clients ping every 20 s; allow generous idle time.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # The admin CLI's internal routes answer loopback only (and refuse
    # proxied requests anyway); never route them from outside.
    location ^~ /internal/ {
        return 404;
    }

    # Metrics are for the monitoring host only.
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:4400;
    }

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
