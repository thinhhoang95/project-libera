server {
    listen 80;
    listen [::]:80;
    server_name libera.intuelle.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name libera.intuelle.com;

    root /srv/libera-updates;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/libera.intuelle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/libera.intuelle.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/stable/(mac|win)/(arm64|x64)/latest(-mac)?\.yml$ {
        default_type application/yaml;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires -1;
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location /stable/ {
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
